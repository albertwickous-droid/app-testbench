[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-testbench"
version = "0.1.0"
description = "Repeatable Android app testing on MuMu Player with JSON/YAML flows and self-contained HTML evidence reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "DISCLAIMER.md",
  "RESPONSIBLE_USE.md",
  "PRIVACY.md",
  "THIRD_PARTY_NOTICES.md",
]
authors = [{ name = "App TestBench contributors" }]
keywords = ["android", "adb", "mumu", "emulator", "automation", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Quality Engineers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0.1,<7"]

[project.urls]
Homepage = "https://github.com/albertwickous-droid/app-testbench"
Repository = "https://github.com/albertwickous-droid/app-testbench"
Issues = "https://github.com/albertwickous-droid/app-testbench/issues"
Changelog = "https://github.com/albertwickous-droid/app-testbench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/albertwickous-droid/app-testbench/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "setuptools>=77",
  "wheel",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1",
  "jsonschema>=4.23",
]

[project.scripts]
app-testbench = "app_testbench.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_testbench = ["skills/*.md", "py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["app_testbench"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
