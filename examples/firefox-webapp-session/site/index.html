<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATB QA Portal</title>
  <style>
    body { font: 18px sans-serif; margin: 0; background: #f7f4ec; color: #162b33; }
    main { max-width: 620px; margin: 0 auto; padding: 28px; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 8px 28px #18333a1a; }
    h1 { margin-top: 0; color: #0b7a75; }
    label, input, button, a { display: block; box-sizing: border-box; width: 100%; margin: 12px 0; padding: 13px; font-size: 18px; }
    button, a { background: #0b7a75; color: white; border: 0; border-radius: 8px; text-decoration: none; text-align: center; }
    .ok { color: #0b7a75; font-weight: 700; }
    .muted { color: #52666d; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>APP TESTBENCH QA PORTAL</h1>
      <p class="muted">Deterministic local browser fixture with no production credentials.</p>
      <form id="login">
        <label for="username">Username</label>
        <input id="username" aria-label="Username" autocomplete="off" value="">
        <button id="signin" type="submit">Sign in</button>
      </form>
      <section id="session" hidden>
        <p class="ok">Signed in as qa-runner</p>
        <p id="session-source">Session source: Cookie + Local Storage</p>
        <a id="orders-link" href="/orders.html">Open orders</a>
        <a id="download-link" href="/downloads/app-testbench-browser-evidence.txt" download="app-testbench-browser-evidence.txt" download>Download evidence</a>
        <a id="about-link" href="/about.html">About this fixture</a>
      </section>
    </section>
  </main>
  <script>
    const hasCookie = document.cookie.includes('atb_session=active');
    const hasLocalStorage = localStorage.getItem('atb_session') === 'active';
    if (hasCookie || hasLocalStorage) {
      document.getElementById('login').hidden = true;
      document.getElementById('session').hidden = false;
      document.getElementById('session-source').textContent =
        hasCookie && hasLocalStorage ? 'Session source: Cookie + Local Storage' :
        hasCookie ? 'Session source: Cookie only' : 'Session source: Local Storage only';
    }
    document.getElementById('login').addEventListener('submit', (event) => {
      event.preventDefault();
      const user = document.getElementById('username').value.trim();
      if (user !== 'qa-runner') return;
      localStorage.setItem('atb_session', 'active');
      document.cookie = 'atb_session=active; max-age=86400; path=/';
      document.getElementById('login').hidden = true;
      document.getElementById('session').hidden = false;
      document.getElementById('session-source').textContent = 'Session source: Cookie + Local Storage';
    });
  </script>
</body>
</html>
