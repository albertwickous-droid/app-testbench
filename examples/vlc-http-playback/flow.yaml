version: 1
name: vlc-http-playback
description: >
  VLC for Android completes first-run onboarding, opens an HTTP MP4 through an
  ADB-reversed byte-range server, exercises the first-play tutorial, and leaves
  screenshot and logcat evidence of hardware codec playback.
device:
  instance: 0
  package: org.videolan.vlc
  wait_for_boot: true
  boot_timeout: 60
report:
  title: VLC HTTP playback and codec verification
  capture_screenshots: failures
  collect_logcat: true
  clear_logcat: true
  include_ui_xml: true
  max_log_chars: 240000
setup:
  - id: expose-media-port
    name: Expose the local byte-range media server
    action: reverse_port
    port: 18766
  - id: install-vlc
    name: Install the pinned VLC build
    action: install
    apk: "${VLC_APK}"
    expected_package: org.videolan.vlc
    expected_version_code: 13070208
    expected_version_name: 3.7.2
    grant_permissions: true
  - id: reset-vlc
    name: Clear VLC state for deterministic onboarding
    action: clear_app_data
  - id: regrant-vlc-permissions
    name: Reinstall with runtime permissions after clearing app data
    action: install
    apk: "${VLC_APK}"
    expected_package: org.videolan.vlc
    expected_version_code: 13070208
    expected_version_name: 3.7.2
    grant_permissions: true
  - id: landscape-before-launch
    name: Lock landscape before first-run onboarding
    action: orientation
    mode: landscape
  - id: launch-vlc
    name: Launch VLC
    action: launch
steps:
  - id: welcome-wait
    name: Wait for the VLC welcome page
    action: wait_for_text
    text: "欢迎使用 VLC!"
    timeout: 25
  - id: landscape-after-welcome
    name: Reassert landscape after the VLC activity starts
    action: orientation
    mode: landscape
  - id: landscape-settle
    name: Let the activity finish rotating
    action: wait
    seconds: 1
  - id: welcome-shot
    name: Capture the VLC welcome page
    action: screenshot
    label: welcome
  - id: welcome-next
    name: Continue from the welcome page
    action: tap
    x: 1190
    y: 660
  - id: autoscan-wait
    name: Wait for the media-scan page
    action: wait_for_text
    text: "自动扫描媒体文件"
    timeout: 20
  - id: skip-autoscan
    name: Skip automatic media scanning
    action: tap
    x: 1034
    y: 660
  - id: home-wait
    name: Wait for the VLC home screen
    action: wait_for_text
    text: "未找到媒体文件，请传输一些文件到您的设备，或调整您的偏好设置。"
    timeout: 30
  - id: home-shot
    name: Capture the VLC home screen
    action: screenshot
    label: home
  - id: home-ui
    name: Capture VLC home UI evidence
    action: dump_ui
    label: home
  - id: landscape-before-media
    name: Reassert landscape before playback
    action: orientation
    mode: landscape
  - id: open-media
    name: Open the HTTP MP4 in VLC
    action: open
    uri: "${VLC_MEDIA_URL}"
    mime_type: video/mp4
  - id: tutorial-wait
    name: Wait for the first-play tutorial
    action: wait_for_text
    text: "视频播放器入门"
    timeout: 30
  - id: tutorial-shot
    name: Capture the first-play tutorial
    action: screenshot
    label: player-tutorial
  - id: dismiss-tutorial
    name: Close the tutorial without leaving the player
    action: tap
    x: 52
    y: 54
  - id: playback-wait
    name: Let the media decode and advance
    action: wait
    seconds: 5
  - id: playback-shot
    name: Capture real video frames
    action: screenshot
    label: playback
  - id: show-controls
    name: Reveal playback controls
    action: tap
    x: 640
    y: 360
  - id: controls-wait
    name: Wait for controls to render
    action: wait
    seconds: 1
  - id: controls-shot
    name: Capture playback controls and timeline
    action: screenshot
    label: playback-controls
  - id: media-logcat
    name: Capture codec and HTTP logcat evidence
    action: logcat
    label: playback
    lines: 4000
teardown:
  - id: close-vlc
    name: Close VLC
    action: close
    continue_on_error: true
  - id: final-logcat
    name: Capture final VLC logcat
    action: logcat
    label: final
    lines: 4000
    continue_on_error: true
  - id: remove-media-reverse
    name: Remove the ADB reverse mapping
    action: reverse_port
    port: 18766
    remove: true
    continue_on_error: true
