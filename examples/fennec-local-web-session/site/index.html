<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldDesk QA Console</title>
<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #eef3f8; color: #15253d; }
  main { width: min(100%, 760px); margin: 0 auto; padding: 36px 24px 56px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; font-size: 28px; font-weight: 800; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: #1667d9; color: white; display: grid; place-items: center; }
  .card { background: white; border: 1px solid #d3deeb; border-radius: 18px; padding: 24px; box-shadow: 0 12px 32px rgba(22, 54, 92, .09); }
  h1 { margin: 0 0 8px; font-size: 30px; }
  p { line-height: 1.5; color: #49617f; }
  label { display: block; margin-top: 18px; font-weight: 700; }
  input { width: 100%; margin-top: 8px; padding: 14px 16px; font-size: 17px; border: 1px solid #9eb2c9; border-radius: 10px; background: #fbfdff; }
  button { margin-top: 20px; width: 100%; padding: 15px; border: 0; border-radius: 10px; background: #1667d9; color: white; font-size: 17px; font-weight: 750; }
  .hint { font-size: 14px; margin-top: 16px; }
  .hidden { display: none !important; }
  .topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .status { background: #e5f6ec; color: #14633b; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 800; }
  .spinner { color: #8a5a00; background: #fff2d5; }
  .toolbar { display: flex; gap: 10px; margin-top: 22px; }
  .toolbar input { margin: 0; }
  .toolbar button { width: auto; margin: 0; padding: 12px 18px; }
  .result { margin-top: 18px; padding: 18px; border: 1px solid #d3deeb; border-radius: 12px; }
  .result h2 { margin: 0 0 8px; font-size: 20px; }
  .result button { margin-top: 12px; padding: 10px; }
  .detail { margin-top: 20px; background: #10213a; color: white; }
  .detail p { color: #c9d9ed; }
  .detail code { color: #8ee6b1; }
  .muted { color: #69809c; font-size: 14px; }
  .link { color: #1667d9; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">FD</span><span>FieldDesk</span></div>

  <section id="login-view" class="card">
    <h1>QA Operations Console</h1>
    <p>Sign in to inspect release checks and incident notes from the mobile web workspace.</p>
    <form id="login-form">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="qa@example.test">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="demo123">
      <button id="login-button" type="submit">Sign in</button>
    </form>
    <p class="hint">Demo account: <strong>qa@example.test</strong> / <strong>demo123</strong></p>
    <p id="login-error" class="hint" role="alert"></p>
  </section>

  <section id="dashboard-view" class="card hidden">
    <div class="topline">
      <div>
        <h1>Release workspace</h1>
        <div class="muted">Signed in as <span id="current-user"></span></div>
      </div>
      <span id="workspace-status" class="status spinner">Syncing...</span>
    </div>
    <p id="welcome-text"></p>
    <div class="toolbar">
      <input id="search-input" aria-label="Search release checks" placeholder="Search release checks">
      <button id="search-button" type="button">Search</button>
    </div>
    <div id="search-results" class="result hidden"></div>
    <div id="detail-panel" class="result detail hidden"></div>
    <p><a id="logout-link" class="link" href="#logout">Sign out</a></p>
  </section>
</main>
<script>
  const STORAGE_KEY = 'fielddesk.qa.session';
  const SEARCH_KEY = 'fielddesk.qa.last-query';
  const loginView = document.querySelector('#login-view');
  const dashboardView = document.querySelector('#dashboard-view');
  const status = document.querySelector('#workspace-status');
  const welcome = document.querySelector('#welcome-text');
  const searchResults = document.querySelector('#search-results');
  const detailPanel = document.querySelector('#detail-panel');

  function setSession(email) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ email, signedInAt: Date.now() }));
  }

  function getSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (_) { return null; }
  }

  function showDashboard(session) {
    loginView.classList.add('hidden');
    dashboardView.classList.remove('hidden');
    document.querySelector('#current-user').textContent = session.email;
    welcome.textContent = 'Welcome back. Your release checks are available.';
    const savedQuery = localStorage.getItem(SEARCH_KEY);
    if (savedQuery) document.querySelector('#search-input').value = savedQuery;
    status.textContent = 'Syncing...';
    status.className = 'status spinner';
    setTimeout(() => {
      status.textContent = 'Workspace ready';
      status.className = 'status';
    }, 900);
  }

  function showLogin() {
    dashboardView.classList.add('hidden');
    loginView.classList.remove('hidden');
    document.querySelector('#login-error').textContent = '';
  }

  document.querySelector('#login-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const email = document.querySelector('#email').value.trim();
    const password = document.querySelector('#password').value;
    if (email !== 'qa@example.test' || password !== 'demo123') {
      document.querySelector('#login-error').textContent = 'Invalid demo credentials.';
      return;
    }
    setSession(email);
    showDashboard({ email });
  });

  document.querySelector('#search-button').addEventListener('click', () => {
    const query = document.querySelector('#search-input').value.trim().toLowerCase();
    if (query) localStorage.setItem(SEARCH_KEY, query);
    searchResults.classList.remove('hidden');
    detailPanel.classList.add('hidden');
    searchResults.innerHTML = '<h2>Searching...</h2><p>Querying release checks.</p>';
    setTimeout(() => {
      if (query === 'checkout') {
        searchResults.innerHTML = '<h2>Checkout regression</h2><p>1 result for checkout. Owner: Mobile QA. Status: needs review.</p><button id="open-detail" type="button">Open details</button>';
        document.querySelector('#open-detail').addEventListener('click', () => {
          detailPanel.classList.remove('hidden');
          detailPanel.innerHTML = '<h2>Checkout regression</h2><p>Payment sheet reopened twice after backgrounding the app.</p><p>Evidence bundle: <code>QA-2417</code></p>';
        });
      } else {
        searchResults.innerHTML = '<h2>No matching checks</h2><p>Try “checkout”.</p>';
      }
    }, 700);
  });

  document.querySelector('#logout-link').addEventListener('click', (event) => {
    event.preventDefault();
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SEARCH_KEY);
    showLogin();
  });

  const existingSession = getSession();
  if (existingSession && existingSession.email) showDashboard(existingSession); else showLogin();
</script>
</body>
</html>
