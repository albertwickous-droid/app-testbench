version: 1
name: fennec-local-web-session
description: >
  Fennec F-Droid performs first-run setup, signs into a deterministic local QA
  console, waits for asynchronous state, searches, opens a detail record,
  restarts the browser, verifies localStorage session persistence, and logs out.
device:
  instance: 0
  package: org.mozilla.fennec_fdroid
  wait_for_boot: true
  boot_timeout: 60
report:
  title: Fennec local web session and persistence
  capture_screenshots: failures
  collect_logcat: true
  clear_logcat: true
  include_ui_xml: true
  max_log_chars: 200000
setup:
  - id: expose-site
    name: Expose the local QA site through ADB reverse
    action: reverse_port
    port: 18765
  - id: install-fennec
    name: Install the pinned Fennec build
    action: install
    apk: "${FENNEC_APK}"
    expected_package: org.mozilla.fennec_fdroid
    expected_version_code: 1600020
    expected_version_name: 160.0.0
  - id: reset-fennec
    name: Clear browser state for a deterministic first run
    action: clear_app_data
  - id: portrait-before-launch
    name: Lock portrait before first-run onboarding
    action: orientation
    mode: portrait
  - id: launch-fennec
    name: Launch Fennec
    action: launch
steps:
  - id: first-run-wait
    name: Wait for first-run onboarding
    action: wait
    seconds: 3
  - id: first-run-shot
    name: Capture first-run onboarding
    action: screenshot
    label: first-run
  - id: accept-intro
    name: Continue past the welcome screen
    action: tap
    x: 360
    y: 1057
  - id: default-browser-wait
    name: Wait for the default-browser question
    action: wait_for_text
    text: "要将Fennec设为您的默认浏览器应用吗？"
    timeout: 20
  - id: default-browser-shot
    name: Capture the Android default-browser prompt
    action: screenshot
    label: default-browser-prompt
  - id: decline-default-browser
    name: Keep the current default browser
    action: tap
    x: 438
    y: 842
  - id: privacy-page-wait
    name: Wait for the privacy onboarding page
    action: wait_for_text
    text: "通过内置隐私保护的浏览器打开所有链接"
    timeout: 20
  - id: privacy-page-shot
    name: Capture the privacy onboarding page
    action: screenshot
    label: privacy-onboarding
  - id: decline-default-browser-page
    name: Continue without setting Fennec as default
    action: tap
    x: 360
    y: 986
  - id: browser-home-wait
    name: Wait for the browser home screen
    action: wait_for_text
    text: "Fennec"
    timeout: 20
  - id: portrait-before-site
    name: Reassert portrait after onboarding
    action: orientation
    mode: portrait
  - id: open-site
    name: Open the local FieldDesk QA console
    action: open
    uri: "${FENNEC_SITE_URL}"
    mime_type: text/html
  - id: translation-first-wait
    name: Wait for the deterministic Fennec translation prompt
    action: wait_for_text
    text: "暂时不要"
    timeout: 20
  - id: translation-first-shot
    name: Capture the translation prompt before dismissing it
    action: screenshot
    label: translation-prompt
  - id: dismiss-translation-first
    name: Dismiss the translation prompt
    action: tap
    x: 504
    y: 1224
  - id: wait-after-translation-first
    name: Let the translation bottom sheet finish closing
    action: wait
    seconds: 2
  - id: login-wait
    name: Wait for the FieldDesk login form
    action: wait_for_text
    text: "Work email"
    timeout: 25
  - id: login-shot
    name: Capture the loaded login form
    action: screenshot
    label: login
  - id: focus-email
    name: Focus the work-email field
    action: tap
    x: 360
    y: 593
  - id: wait-after-focus-email
    name: Let the browser focus the email input
    action: wait
    seconds: 1
  - id: enter-email
    name: Enter the deterministic demo email
    action: text
    text: qa@example.test
  - id: wait-after-email
    name: Let the email value commit before moving focus
    action: wait
    seconds: 1
  - id: focus-password
    name: Focus the password field in the restored page viewport
    action: tap
    x: 360
    y: 742
  - id: wait-after-focus-password
    name: Let the browser focus the password input
    action: wait
    seconds: 1
  - id: enter-password
    name: Enter the deterministic demo password
    action: text
    text: demo123
  - id: wait-after-password
    name: Let the password value commit before submitting
    action: wait
    seconds: 1
  - id: submit-login
    name: Submit the login form
    action: tap
    x: 360
    y: 850
  - id: password-save-wait
    name: Wait for the system password-save prompt
    action: wait_for_text
    text: "要保存密码吗？"
    timeout: 20
  - id: password-save-shot
    name: Capture the system password-save prompt
    action: screenshot
    label: password-save-prompt
  - id: decline-password-save
    name: Select the never-save action in the system sheet
    action: tap
    x: 480
    y: 1206
  - id: workspace-ready-wait
    name: Wait for the asynchronous workspace state
    action: wait_for_text
    text: "Workspace ready"
    timeout: 20
  - id: dashboard-shot
    name: Capture the authenticated workspace
    action: screenshot
    label: dashboard
  - id: dashboard-ui
    name: Capture dashboard UI evidence
    action: dump_ui
    label: dashboard
  - id: focus-search
    name: Focus release-check search
    action: tap
    x: 286
    y: 621
  - id: wait-after-focus-search
    name: Let the browser focus the search input
    action: wait
    seconds: 1
  - id: enter-search
    name: Enter the checkout query
    action: text
    text: checkout
  - id: wait-for-search-query
    name: Verify the search input committed before pressing Search
    action: wait_for_text
    text: checkout
    timeout: 5
  - id: submit-search
    name: Submit the search
    action: tap
    x: 580
    y: 621
  - id: search-wait
    name: Wait for the asynchronous search result
    action: wait_for_text
    text: "Checkout regression"
    timeout: 20
  - id: search-shot
    name: Capture the search result
    action: screenshot
    label: search-result
  - id: search-ui
    name: Capture search UI evidence
    action: dump_ui
    label: search-result
  - id: open-detail
    name: Open the incident detail
    action: tap
    x: 360
    y: 966
  - id: detail-wait
    name: Verify the incident evidence bundle
    action: wait_for_text
    text: "QA-2417"
    timeout: 15
  - id: detail-shot
    name: Capture the incident detail
    action: screenshot
    label: detail
  - id: detail-ui
    name: Capture incident UI evidence
    action: dump_ui
    label: detail
  - id: detail-logcat
    name: Capture logcat from the authenticated flow
    action: logcat
    label: authenticated-flow
    lines: 2000
  - id: close-for-restart
    name: Force-stop Fennec before the persistence check
    action: close
  - id: wait-before-relaunch
    name: Wait for the process to stop
    action: wait
    seconds: 1
  - id: portrait-before-relaunch
    name: Keep portrait for the cold relaunch
    action: orientation
    mode: portrait
  - id: relaunch-fennec
    name: Cold-launch Fennec
    action: launch
  - id: open-site-after-restart
    name: Reopen the same local QA console
    action: open
    uri: "${FENNEC_SITE_URL}"
    mime_type: text/html
  - id: translation-restart-wait
    name: Wait for the translation prompt after cold restart
    action: wait_for_text
    text: "暂时不要"
    timeout: 20
  - id: dismiss-translation-restart
    name: Dismiss the translation prompt after restart
    action: tap
    x: 504
    y: 1224
  - id: wait-after-translation-restart
    name: Let the translation bottom sheet finish closing after restart
    action: wait
    seconds: 2
  - id: restored-session-wait
    name: Wait for the restored authenticated workspace
    action: wait_for_text
    text: "Workspace ready"
    timeout: 25
  - id: persisted-query-assertion
    name: Verify the previous search query survived restart
    action: assert_ui_contains
    text: checkout
  - id: restored-shot
    name: Capture the restored session
    action: screenshot
    label: session-restored
  - id: restored-ui
    name: Capture restored-session UI evidence
    action: dump_ui
    label: session-restored
  - id: sign-out
    name: Sign out of the local QA console
    action: tap
    x: 117
    y: 699
  - id: login-returned-wait
    name: Verify logout returned to the login form
    action: wait_for_text
    text: "Sign in"
    timeout: 15
  - id: dashboard-absent-assertion
    name: Verify the authenticated workspace is gone
    action: assert_ui_not_contains
    text: "Release workspace"
  - id: logout-shot
    name: Capture the logged-out state
    action: screenshot
    label: logged-out
  - id: logout-ui
    name: Capture logout UI evidence
    action: dump_ui
    label: logged-out
teardown:
  - id: close-fennec
    name: Close Fennec
    action: close
    continue_on_error: true
  - id: final-logcat
    name: Capture final Fennec logcat
    action: logcat
    label: final
    lines: 3000
    continue_on_error: true
  - id: remove-site-reverse
    name: Remove the ADB reverse mapping
    action: reverse_port
    port: 18765
    remove: true
    continue_on_error: true
