version: 1
name: markor-note-persistence
description: Create a note, save it, cold-start Markor, and verify the note content survives.
device:
  instance: 0
  package: net.gsantner.markor
  wait_for_boot: true
  boot_timeout: 60
report:
  title: Markor note persistence / 冷启动持久化
  capture_screenshots: manual
  collect_logcat: true
  clear_logcat: true
  include_ui_xml: true
  max_log_chars: 120000
setup:
  - name: Install pinned Markor build
    action: install
    apk: ${MARKOR_APK}
    reinstall: true
    grant_permissions: true
    expected_package: net.gsantner.markor
    expected_version_code: 164
    expected_version_name: 2026.10.0
steps:
  - name: Launch Markor after a clean app-data reset
    action: launch
  - name: Wait for Markor onboarding
    action: wait_for_text
    text: 主界面
    timeout: 20
  - name: Onboarding page 1
    action: tap
    x: 1226
    y: 668
  - name: Wait for view page
    action: wait_for_text
    text: 查看
    timeout: 10
  - name: Onboarding page 2
    action: tap
    x: 1226
    y: 668
  - name: Wait for share page
    action: wait_for_text
    text: 分享 -> Markor
    timeout: 10
  - name: Onboarding page 3
    action: tap
    x: 1226
    y: 668
  - name: Wait for To-Do page
    action: wait_for_text
    text: To-Do
    timeout: 10
  - name: Onboarding page 4
    action: tap
    x: 1226
    y: 668
  - name: Wait for QuickNote page
    action: wait_for_text
    text: QuickNote
    timeout: 10
  - name: Finish onboarding
    action: tap
    x: 1226
    y: 666
  - name: Dismiss Markor release notes
    action: wait_for_text
    text: 确定
    timeout: 10
  - name: Close release notes
    action: tap
    x: 1190
    y: 654
  - name: Wait for Markor browser
    action: wait_for_text
    text: Markor
    timeout: 20
  - name: Capture file browser
    action: screenshot
    label: markor-browser
  - name: Open create-file dialog
    action: tap
    x: 1214
    y: 570
  - name: Wait for create dialog
    action: wait_for_text
    text: 名称
    timeout: 10
  - name: Enter note title
    action: text
    text: ${NOTE_TITLE}
  - name: Confirm note creation
    action: tap
    x: 1190
    y: 649
  - name: Wait for editor
    action: wait_for_text
    text: ${NOTE_TITLE}
    timeout: 10
  - name: Focus note body
    action: tap
    x: 640
    y: 160
  - name: Wait for editor input readiness
    action: wait
    seconds: 1
  - name: Enter note body
    action: text
    text: App TestBench persistence check
  - name: Wait for text commit
    action: wait
    seconds: 0.5
  - name: Assert note body is visible before save
    action: assert_ui_contains
    text: App TestBench persistence check
  - name: Save note
    action: tap
    x: 1070
    y: 72
  - name: Wait for save
    action: wait
    seconds: 1
  - name: Capture saved note
    action: screenshot
    label: markor-note-saved
  - name: Close Markor
    action: close
  - name: Relaunch Markor
    action: launch
  - name: Wait for persisted note in browser
    action: wait_for_text
    text: ${NOTE_TITLE}
    timeout: 20
  - name: Capture persisted file list
    action: screenshot
    label: markor-note-persisted
  - name: Open file search
    action: tap
    x: 1190
    y: 72
  - name: Wait for file search dialog
    action: wait_for_text
    text: 在目录中递归搜索
    timeout: 10
  - name: Focus file search query
    action: tap
    x: 640
    y: 270
  - name: Enter exact file title
    action: text
    text: ${NOTE_TITLE}
  - name: Submit file search
    action: tap
    x: 748
    y: 592
  - name: Wait for matching file result
    action: wait_for_text
    text: ${NOTE_TITLE}
    timeout: 20
  - name: Capture file search result
    action: screenshot
    label: markor-search-result
  - name: Select matching file result
    action: tap
    x: 640
    y: 406
  - name: Wait for saved note body
    action: wait_for_text
    text: App TestBench persistence check
    timeout: 10
  - name: Assert note body survived relaunch
    action: assert_ui_contains
    text: App TestBench persistence check
  - name: Capture reopened note
    action: screenshot
    label: markor-note-reopened
  - name: Save reopened UI tree
    action: dump_ui
    label: markor-note-reopened
teardown:
  - name: Close Markor
    action: close
    continue_on_error: true
  - name: Capture final logcat
    action: logcat
    label: final
    lines: 1500
