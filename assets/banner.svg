<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">App TestBench</title>
  <desc id="desc">Mature MuMu runtime with deterministic app test flows and an HTML evidence report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09141b"/>
      <stop offset="0.55" stop-color="#10232d"/>
      <stop offset="1" stop-color="#0b3033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f0df"/>
      <stop offset="1" stop-color="#16a69c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#b7e9e4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="1020" cy="50" r="180" fill="#42d6c5" opacity=".065"/>
  <circle cx="1110" cy="330" r="190" fill="#1d8f8b" opacity=".08"/>

  <g transform="translate(56 52)">
    <rect width="72" height="72" rx="20" fill="#102b34" stroke="#3bc8bb" stroke-opacity=".6"/>
    <rect x="20" y="14" width="32" height="44" rx="8" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M31 25l5 4-5 4M39 33h7" fill="none" stroke="#b5fff5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="50" r="2.4" fill="#75f0df"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="152" y="101" fill="#f2fbfa" font-size="54" font-weight="760" letter-spacing="-2.1">App TestBench</text>
    <text x="154" y="136" fill="#8fb3b5" font-size="17" letter-spacing=".2">Mature MuMu runtime. Evidence-first app tests.</text>
    <g transform="translate(154 166)">
      <rect width="91" height="30" rx="15" fill="#17323a" stroke="#31525b"/>
      <text x="45.5" y="20" text-anchor="middle" fill="#bfeee8" font-size="12" font-weight="650" letter-spacing=".4">doctor</text>
      <rect x="101" width="104" height="30" rx="15" fill="#17323a" stroke="#31525b"/>
      <text x="153" y="20" text-anchor="middle" fill="#bfeee8" font-size="12" font-weight="650" letter-spacing=".4">JSON / YAML</text>
      <rect x="215" width="122" height="30" rx="15" fill="#123c3b" stroke="#2b8d86"/>
      <text x="276" y="20" text-anchor="middle" fill="#7ee7db" font-size="12" font-weight="650" letter-spacing=".4">HTML report</text>
    </g>
    <text x="56" y="320" fill="#5d8288" font-size="12" letter-spacing="1.5">MUMU MANAGER + ADB / LOCAL ONLY / NO TELEMETRY</text>
  </g>

  <g transform="translate(690 56)">
    <rect width="190" height="118" rx="18" fill="#11242d" stroke="#29434d"/>
    <rect x="16" y="16" width="158" height="86" rx="12" fill="#0a171e" stroke="#24404a"/>
    <circle cx="29" cy="28" r="3" fill="#ff8278"/><circle cx="40" cy="28" r="3" fill="#f4bd6a"/><circle cx="51" cy="28" r="3" fill="#64d99b"/>
    <text x="32" y="58" fill="#8fb3b5" font-family="Cascadia Code, Consolas, monospace" font-size="12">MuMuManager</text>
    <text x="32" y="76" fill="#75f0df" font-family="Cascadia Code, Consolas, monospace" font-size="12">info -v all</text>
    <text x="32" y="94" fill="#657f87" font-family="Cascadia Code, Consolas, monospace" font-size="11">instance 0 · online</text>

    <path d="M202 59h48" stroke="#3f7879" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M246 54l8 5-8 5" fill="none" stroke="#75f0df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="260" y="0" width="184" height="118" rx="18" fill="#102b31" stroke="#326b69"/>
    <text x="280" y="31" fill="#8fb3b5" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="1.4">FLOW ENGINE</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
      <text x="280" y="57" fill="#e7faf7">01  launch</text>
      <text x="280" y="76" fill="#e7faf7">02  tap</text>
      <text x="280" y="95" fill="#e7faf7">03  screenshot</text>
      <circle cx="269" cy="53" r="3" fill="#64d99b"/><circle cx="269" cy="72" r="3" fill="#64d99b"/><circle cx="269" cy="91" r="3" fill="#f4bd6a"/>
    </g>

    <path d="M454 59h46" stroke="#3f7879" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M496 54l8 5-8 5" fill="none" stroke="#75f0df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(510 0)">
      <rect width="154" height="198" rx="20" fill="#eef6f4"/>
      <rect x="14" y="14" width="126" height="15" rx="7.5" fill="#132d36"/>
      <circle cx="25" cy="21.5" r="3" fill="#64d99b"/>
      <rect x="36" y="19" width="52" height="5" rx="2.5" fill="#53717a"/>
      <rect x="14" y="43" width="126" height="62" rx="9" fill="#d4e7e2"/>
      <path d="M46 68l13 10-13 10M68 88h29" fill="none" stroke="#167c75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="14" y="119" width="58" height="8" rx="4" fill="#2b625f"/>
      <rect x="14" y="135" width="100" height="6" rx="3" fill="#9cb7b3"/>
      <rect x="14" y="149" width="84" height="6" rx="3" fill="#9cb7b3"/>
      <rect x="14" y="173" width="46" height="13" rx="6.5" fill="#bfe8df"/>
      <rect x="68" y="173" width="72" height="13" rx="6.5" fill="#177c74"/>
    </g>
  </g>
  <circle cx="761" cy="115" r="3" fill="#75f0df" filter="url(#glow)" opacity=".8"/>
</svg>
