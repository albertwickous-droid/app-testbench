<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic App TestBench HTML report preview</title>
  <desc id="desc">A synthetic report showing a passed login-smoke flow, step timings, and a fake mobile login screen. No real application or account data is used.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4f1"/>
      <stop offset="1" stop-color="#d9e7e3"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2029"/>
      <stop offset="1" stop-color="#123b3e"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102e38"/>
      <stop offset="1" stop-color="#0b1b23"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173b3a" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2c6e68" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <g transform="translate(40 34)" filter="url(#shadow)">
    <rect width="1120" height="652" rx="24" fill="#fbfefd" stroke="#c9ded8"/>

    <path d="M0 24A24 24 0 0 1 24 0h1072a24 24 0 0 1 24 24v112H0z" fill="url(#header)"/>
    <g transform="translate(30 29)">
      <rect width="54" height="54" rx="15" fill="#102e37" stroke="#3bc8bb" stroke-opacity=".75"/>
      <rect x="15" y="10" width="24" height="34" rx="6" fill="none" stroke="#77ecdd" stroke-width="2.5"/>
      <path d="M23 20l4 3-4 3M30 26h6" fill="none" stroke="#b8fff5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <text x="100" y="50" fill="#f3fffd" font-size="24" font-weight="760">App TestBench report</text>
      <text x="100" y="75" fill="#86aeb0" font-size="12" letter-spacing="1.1">LOCAL EVIDENCE BUNDLE</text>
      <text x="30" y="112" fill="#eaf9f6" font-size="31" font-weight="700">login-smoke</text>
      <text x="211" y="111" fill="#83a6a9" font-size="14">synthetic demo · instance 0</text>
      <rect x="870" y="29" width="102" height="32" rx="16" fill="#103d36" stroke="#37a678"/>
      <circle cx="888" cy="45" r="4" fill="#65dc9b"/>
      <text x="900" y="50" fill="#a9f0c8" font-size="13" font-weight="700">PASSED</text>
      <text x="1000" y="50" fill="#7f9fa3" font-size="12">2026-11-14 09:42</text>
      <rect x="870" y="78" width="220" height="32" rx="10" fill="#102b34" stroke="#2d5058"/>
      <text x="886" y="99" fill="#8ab2b4" font-family="Cascadia Code, Consolas, monospace" font-size="11">result.json  ·  report.html</text>
    </g>

    <g transform="translate(30 140)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <g>
        <rect width="160" height="76" rx="14" fill="#eef8f5" stroke="#d4e8e2"/>
        <text x="16" y="26" fill="#78928f" font-size="11" letter-spacing=".8">PASSED</text>
        <text x="16" y="55" fill="#176f60" font-size="28" font-weight="740">6</text>
        <text x="47" y="55" fill="#8ba5a1" font-size="12">steps</text>
      </g>
      <g transform="translate(176)">
        <rect width="160" height="76" rx="14" fill="#eef8f5" stroke="#d4e8e2"/>
        <text x="16" y="26" fill="#78928f" font-size="11" letter-spacing=".8">DURATION</text>
        <text x="16" y="55" fill="#263f43" font-size="28" font-weight="740">18.4</text>
        <text x="76" y="55" fill="#8ba5a1" font-size="12">sec</text>
      </g>
      <g transform="translate(352)">
        <rect width="160" height="76" rx="14" fill="#eef8f5" stroke="#d4e8e2"/>
        <text x="16" y="26" fill="#78928f" font-size="11" letter-spacing=".8">EVIDENCE</text>
        <text x="16" y="55" fill="#263f43" font-size="28" font-weight="740">3</text>
        <text x="47" y="55" fill="#8ba5a1" font-size="12">artifacts</text>
      </g>
      <g transform="translate(528)">
        <rect width="160" height="76" rx="14" fill="#fff7ed" stroke="#efdfc8"/>
        <text x="16" y="26" fill="#9d8060" font-size="11" letter-spacing=".8">FAILED</text>
        <text x="16" y="55" fill="#a26524" font-size="28" font-weight="740">0</text>
        <text x="47" y="55" fill="#b29372" font-size="12">steps</text>
      </g>
    </g>

    <g transform="translate(30 240)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <rect width="688" height="378" rx="18" fill="#ffffff" stroke="#d8e7e3"/>
      <text x="22" y="30" fill="#29454a" font-size="15" font-weight="700">Execution steps</text>
      <text x="620" y="30" fill="#9aafac" font-size="11">6 passed</text>
      <line x1="22" y1="44" x2="666" y2="44" stroke="#e8f0ee"/>

      <g font-size="13">
        <g transform="translate(22 63)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Launch app</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">0.82s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
        <g transform="translate(22 105)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Wait for login screen</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">3.10s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
        <g transform="translate(22 147)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Tap email field</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">0.36s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
        <g transform="translate(22 189)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Enter test email</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">0.41s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
        <g transform="translate(22 231)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Capture login screen</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">0.53s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
        <g transform="translate(22 273)">
          <circle cx="10" cy="10" r="10" fill="#e4f6ee"/><path d="M5.5 10l3 3 6-7" fill="none" stroke="#2a9b6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="32" y="15" fill="#29454a" font-weight="650">Assert login button</text>
          <text x="470" y="15" fill="#7f9999" font-family="Cascadia Code, Consolas, monospace" font-size="11">0.29s</text>
          <rect x="558" y="1" width="62" height="20" rx="10" fill="#eaf7f1"/><text x="589" y="15" text-anchor="middle" fill="#288b69" font-size="10" font-weight="700">PASSED</text>
        </g>
      </g>

      <rect x="22" y="316" width="644" height="40" rx="10" fill="#f5faf8" stroke="#dfebe7"/>
      <text x="38" y="341" fill="#718d8a" font-size="11">Artifacts: 1 screenshot · 1 UI tree · 1 logcat · structured result.json</text>
    </g>

    <g transform="translate(746 240)" filter="url(#shadow)">
      <rect width="324" height="378" rx="22" fill="url(#phone)" stroke="#244750"/>
      <rect x="12" y="12" width="300" height="354" rx="16" fill="#f4faf8"/>
      <rect x="94" y="21" width="136" height="18" rx="9" fill="#17343d"/>
      <text x="162" y="34" text-anchor="middle" fill="#739398" font-family="Cascadia Code, Consolas, monospace" font-size="8">MUMU · SYNTHETIC APP</text>

      <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
        <circle cx="162" cy="82" r="28" fill="#d8efe8"/>
        <path d="M149 82l9 9 17-20" fill="none" stroke="#1b8d72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="162" y="130" text-anchor="middle" fill="#1d3d43" font-size="21" font-weight="740">Welcome back</text>
        <text x="162" y="151" text-anchor="middle" fill="#88a09d" font-size="11">Synthetic preview · no real account</text>

        <rect x="40" y="181" width="244" height="42" rx="11" fill="#ffffff" stroke="#c9dcd6"/>
        <text x="56" y="199" fill="#76938e" font-size="9">EMAIL</text>
        <text x="56" y="214" fill="#2d4b50" font-family="Cascadia Code, Consolas, monospace" font-size="11">qa@example.com</text>

        <rect x="40" y="235" width="244" height="42" rx="11" fill="#ffffff" stroke="#c9dcd6"/>
        <text x="56" y="253" fill="#76938e" font-size="9">PASSWORD</text>
        <text x="56" y="268" fill="#2d4b50" font-family="Cascadia Code, Consolas, monospace" font-size="11">••••••••••••</text>

        <rect x="40" y="296" width="244" height="42" rx="12" fill="#147c70"/>
        <text x="162" y="322" text-anchor="middle" fill="#f3fffc" font-size="13" font-weight="700">Sign in</text>
        <text x="162" y="356" text-anchor="middle" fill="#89a6a1" font-size="9">assets/screenshots/login.png</text>
      </g>
    </g>

    <text x="30" y="640" fill="#8aa09e" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10">SYNTHETIC PREVIEW / 合成示意：使用虚构流程、占位账号与模拟截图，不代表真实应用数据。</text>
  </g>
