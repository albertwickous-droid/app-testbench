<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">App TestBench — mature MuMu runtime, evidence-first app testing</title>
  <desc id="desc">Synthetic social preview showing a mature MuMu runtime, deterministic JSON/YAML app test flows, and an HTML evidence report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07151c"/>
      <stop offset=".55" stop-color="#0b2029"/>
      <stop offset="1" stop-color="#0b2a31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f5e5"/>
      <stop offset="1" stop-color="#2fb7a9"/>
    </linearGradient>
    <linearGradient id="report" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2faf8"/>
      <stop offset="1" stop-color="#d8ebe7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9eece4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="64" r="260" fill="#40d7c7" opacity=".055"/>
  <circle cx="1200" cy="590" r="300" fill="#177d79" opacity=".12"/>

  <g transform="translate(72 58)">
    <rect width="74" height="74" rx="20" fill="#102b34" stroke="#3bc8bb" stroke-opacity=".62"/>
    <rect x="21" y="14" width="32" height="46" rx="8" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M32 26l5 4-5 4M40 34h7" fill="none" stroke="#b5fff5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="51" r="2.5" fill="#75f0df"/>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="170" y="112" fill="#f3fffd" font-size="68" font-weight="760" letter-spacing="-3">App TestBench</text>
    <text x="173" y="152" fill="#9ebcbf" font-size="21" letter-spacing=".2">Mature MuMu runtime. Evidence-first app tests.</text>
    <text x="174" y="183" fill="#6fa2a4" font-size="15">MuMu Manager + ADB  ·  CLI  ·  JSON/YAML  ·  HTML report</text>

    <g transform="translate(174 218)">
      <rect width="104" height="34" rx="17" fill="#14323a" stroke="#335963"/>
      <text x="52" y="22.5" text-anchor="middle" fill="#c8f4ee" font-size="13" font-weight="650">doctor</text>
      <rect x="114" width="134" height="34" rx="17" fill="#14323a" stroke="#335963"/>
      <text x="181" y="22.5" text-anchor="middle" fill="#c8f4ee" font-size="13" font-weight="650">flow validate</text>
      <rect x="258" width="146" height="34" rx="17" fill="#113f3d" stroke="#2e9189"/>
      <text x="331" y="22.5" text-anchor="middle" fill="#88eee3" font-size="13" font-weight="650">HTML evidence</text>
    </g>

    <text x="72" y="554" fill="#69a2a4" font-size="13" letter-spacing="1.7">LOCAL ONLY</text>
    <circle cx="169" cy="549.5" r="2.2" fill="#4a7d80"/>
    <text x="184" y="554" fill="#69a2a4" font-size="13" letter-spacing="1.7">NO TELEMETRY</text>
    <circle cx="319" cy="549.5" r="2.2" fill="#4a7d80"/>
    <text x="334" y="554" fill="#69a2a4" font-size="13" letter-spacing="1.7">MIT</text>
    <text x="72" y="594" fill="#486f75" font-size="12" letter-spacing="1.2">MUMU PLAYER + ADB / WINDOWS 10–11 / PYTHON 3.10+</text>
  </g>

  <g transform="translate(680 58)" filter="url(#shadow)">
    <rect width="530" height="226" rx="24" fill="#0b1c24" stroke="#27434d"/>
    <circle cx="26" cy="26" r="4" fill="#ff8278"/>
    <circle cx="40" cy="26" r="4" fill="#f4bd6a"/>
    <circle cx="54" cy="26" r="4" fill="#64d99b"/>
    <text x="76" y="30" fill="#688a91" font-family="Cascadia Code, Consolas, monospace" font-size="12">powershell</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="14">
      <text x="28" y="73" fill="#73ddd1">PS&gt;</text>
      <text x="70" y="73" fill="#d9f2ef">app-testbench doctor --json</text>
      <text x="28" y="105" fill="#64848b">{"ok": true, "tools": {</text>
      <text x="53" y="127" fill="#99b8bb">"mumu": "ready",</text>
      <text x="53" y="149" fill="#99b8bb">"adb": "ready"</text>
      <text x="28" y="171" fill="#64848b">}, "instance": 0}</text>
      <text x="28" y="201" fill="#73ddd1">PS&gt;</text>
      <text x="70" y="201" fill="#d9f2ef">app-testbench run flow.yaml</text>
    </g>
  </g>

  <g transform="translate(732 306)">
    <rect width="126" height="142" rx="18" fill="#10272f" stroke="#2a4c56" filter="url(#shadow)"/>
    <text x="18" y="28" fill="#6f969b" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="1.2">INPUTS</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
      <text x="18" y="58" fill="#e3f8f5">MuMu</text>
      <text x="18" y="80" fill="#7da5a8">Manager</text>
      <text x="18" y="109" fill="#e3f8f5">ADB</text>
      <text x="18" y="131" fill="#7da5a8">device</text>
    </g>
  </g>

  <path d="M866 377h44" stroke="#3f7b7c" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M904 372l8 5-8 5" fill="none" stroke="#75f0df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(922 306)">
    <rect width="140" height="142" rx="18" fill="#102b31" stroke="#326b69" filter="url(#shadow)"/>
    <text x="18" y="28" fill="#83b9b6" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="1.2">FLOW</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
      <circle cx="22" cy="53" r="3" fill="#64d99b"/><text x="34" y="58" fill="#e7faf7">launch</text>
      <circle cx="22" cy="79" r="3" fill="#64d99b"/><text x="34" y="84" fill="#e7faf7">tap</text>
      <circle cx="22" cy="105" r="3" fill="#f4bd6a"/><text x="34" y="110" fill="#e7faf7">screenshot</text>
      <circle cx="22" cy="131" r="3" fill="#64d99b"/><text x="34" y="136" fill="#e7faf7">assert</text>
    </g>
  </g>

  <path d="M1072 377h40" stroke="#3f7b7c" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M1106 372l8 5-8 5" fill="none" stroke="#75f0df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1148 306)" filter="url(#shadow)">
    <rect width="72" height="142" rx="16" fill="url(#report)"/>
    <rect x="12" y="16" width="48" height="12" rx="6" fill="#16313a"/>
    <circle cx="20" cy="22" r="2.5" fill="#64d99b"/>
    <rect x="28" y="20" width="24" height="4" rx="2" fill="#6c8d91"/>
    <rect x="12" y="40" width="48" height="42" rx="8" fill="#cfe5df"/>
    <path d="M26 54l7 7-7 7M39 68h12" fill="none" stroke="#157d74" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12" y="94" width="35" height="6" rx="3" fill="#345f5d"/>
    <rect x="12" y="107" width="47" height="5" rx="2.5" fill="#93b2ad"/>
    <rect x="12" y="120" width="29" height="5" rx="2.5" fill="#93b2ad"/>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#628d91" text-anchor="middle">
    <text x="795" y="477">DISCOVER</text>
    <text x="992" y="477">ORCHESTRATE</text>
    <text x="1184" y="477">EVIDENCE</text>
  </g>

  <circle cx="1011" cy="140" r="4" fill="#75f0df" filter="url(#glow)" opacity=".85"/>
</svg>
