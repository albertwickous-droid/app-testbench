changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Features / 新功能"
      labels:
        - feature
        - enhancement
    - title: "Fixes / 修复"
      labels:
        - bug
        - fix
    - title: "Documentation / 文档"
      labels:
        - documentation
        - docs
    - title: "CI, Packaging & Security / CI、打包与安全"
      labels:
        - ci
        - packaging
        - security
        - dependencies
    - title: "Maintenance / 维护"
      labels:
        - chore
        - refactor
        - test
    - title: "Other Changes / 其他变更"
      labels:
        - "*"
